<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Eindkaart Halloween Padel</title>
<style>
/* Transparante eindkaart 1080x1920 die over de laatste seconden van de video wordt gelegd. */
@font-face{font-family:"Creep";src:url(../fonts/Creepster-Regular.ttf)}
@font-face{font-family:"Poppins";font-weight:900;font-style:italic;src:url(../fonts/Poppins-BlackItalic.ttf)}
@font-face{font-family:"Poppins";font-weight:800;font-style:italic;src:url(../fonts/Poppins-ExtraBoldItalic.ttf)}
@font-face{font-family:"Poppins";font-weight:600;font-style:normal;src:url(../fonts/Poppins-SemiBold.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:"Poppins",sans-serif;color:#fff;position:relative;-webkit-font-smoothing:antialiased}
.top{position:absolute;top:0;left:0;right:0;height:330px;padding-top:56px;text-align:center;background:linear-gradient(to bottom,rgba(20,12,31,.92) 0%,rgba(20,12,31,.75) 60%,rgba(20,12,31,0) 100%)}
.h1{font-family:"Creep";font-size:104px;line-height:.9;color:#FF7A1A;letter-spacing:3px;text-shadow:0 0 28px rgba(255,122,26,.5),0 6px 0 #4a1d00}
.h2{font-weight:900;font-style:italic;font-size:50px;line-height:1;letter-spacing:6px}
.h2 span{color:#CDFD50}
.bottom{position:absolute;left:0;right:0;bottom:0;height:860px;padding-top:300px;text-align:center;background:linear-gradient(to top,rgba(20,12,31,.95) 0%,rgba(20,12,31,.85) 55%,rgba(20,12,31,0) 100%)}
.date{display:inline-block;font-weight:900;font-style:italic;font-size:52px;line-height:1;border-top:5px solid #FF7A1A;border-bottom:5px solid #FF7A1A;padding:12px 26px}
.offer{display:inline-block;margin-top:30px;background:#CDFD50;color:#14120f;transform:skewX(-10deg) rotate(-2deg);padding:16px 50px 18px;box-shadow:0 0 50px rgba(205,253,80,.4)}
.offer>div{transform:skewX(10deg)}
.a,.c{font-weight:800;font-style:italic;font-size:34px;line-height:1;letter-spacing:2px}
.b{font-weight:900;font-style:italic;font-size:104px;line-height:.95;letter-spacing:-2px}
.logo{margin-top:34px}
.logo img{height:70px}
.addr{font-weight:600;font-size:26px;margin-top:6px;opacity:.9}
</style></head><body>
<div class="top"><div class="h1">HALLOWEEN</div><div class="h2">PADEL <span>SPECIAL</span></div></div>
<div class="bottom">
  <div class="date">ZATERDAG 31 OKTOBER</div><br>
  <div class="offer"><div><div class="a">KOM VERKLEED =</div><div class="b">50% KORTING</div><div class="c">OP JE BAAN</div></div></div>
  <div class="logo"><img src="../build/logo-poort-padel-wit.png" alt="Poort Padel"></div>
  <div class="addr">Neonweg 62 · Almere Poort · boek via Playtomic</div>
</div>
</body></html>
